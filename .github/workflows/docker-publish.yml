name: Build and Push Docker Images

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false # <-- Tambahkan ini agar jika satu gagal, yang lain tetap lanjut
      matrix:
        service: [backend, frontend, ml-service]
        include:
          - service: backend
            context: ./backend
            dockerfile: ./docker/php/Dockerfile # Pastikan path ini benar
          - service: frontend
            context: ./frontend
            dockerfile: ./Dockerfile # Diperbaiki: karena context sudah di ./frontend
          - service: ml-service
            context: ./ml-service
            dockerfile: ./Dockerfile # Diperbaiki: karena context sudah di ./ml-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}