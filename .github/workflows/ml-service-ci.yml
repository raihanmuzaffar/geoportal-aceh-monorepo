name: ML Service CI (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - 'ml-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'ml-service/**'

jobs:
  test-fastapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml-service

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Tests
      run: |
        # Contoh sederhana: cek apakah aplikasi bisa di-import
        python -c "from main import app; print('✓ FastAPI app imports successfully')"
        # Jika sudah ada file test, jalankan: pytest