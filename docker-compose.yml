services:
  # ==== Backend (Laravel) ====
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: geoportal-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - geoportal-net
    depends_on:
      - db
      - redis

  # ==== Web Server (Nginx untuk Laravel) ====
  nginx:
    image: nginx:alpine
    container_name: geoportal-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - geoportal-net
    depends_on:
      - app

  # ==== Database (PostgreSQL + PostGIS) ====
  db:
    image: postgis/postgis:16-3.4
    container_name: geoportal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-geoportal}
      POSTGRES_USER: ${DB_USERNAME:-geoportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - geoportal-net

  # ==== Cache & Queue ====
  redis:
    image: redis:7-alpine
    container_name: geoportal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - geoportal-net

  # ==== Frontend (React + Vite) ====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geoportal-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - geoportal-net
    depends_on:
      - nginx

  # ==== ML Service (FastAPI) ====
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: geoportal-ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./ml-service:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - geoportal-net
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

networks:
  geoportal-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: